[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "scverse-misc"
description = "Miscellaneous utility code used by scverse packages"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Ilia Kats", email = "i.kats@dkfz.de" },
]
authors = [
  { name = "Ilia Kats" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  # for debug logging (referenced from the issue template)
  "session-info2",
  "typing-extensions; python_version<'3.13'",
]
optional-dependencies.datasets = [ "anndata", "pooch", "pyyaml", "tqdm" ]
optional-dependencies.logging = [ "pydantic" ]
optional-dependencies.rich = [ "rich" ]
optional-dependencies.settings = [ "pydantic-settings", "python-dotenv" ]
optional-dependencies.spatialdata = [ "spatialdata" ]
optional-dependencies.sphinx = [ "jinja2", "pydocstring-rs>=0.4.1", "scverse-doc", "sphinx>=9" ]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://scverse-misc.readthedocs.io/"
urls.Homepage = "https://github.com/scverse/scverse-misc"
urls.Source = "https://github.com/scverse/scverse-misc"

[dependency-groups]
dev = [
  "prek",
  "twine>=4.0.2",
]
test = [ "coverage>=7.10", "pytest" ]
doc = [
  "anndata",                                        # resolves the anndata loader's type hints during doc builds
  "ipykernel",
  "ipython",
  "pandas",
  "scverse-doc[full]>=0.1.1",
  "scverse-misc[datasets,logging,settings,sphinx]",
  "sphinx-autodoc-typehints",
  "sphinx-codeautolink",
  "sphinxcontrib-bibtex>=1",
  "sphinxcontrib-katex",
]

[tool.hatch]
version.source = "vcs"
envs.default.installer = "uv"
envs.default.dependency-groups = [ "dev" ]
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build {args}"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.docs.scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
envs.docs.dependency-groups = [ "doc" ]
envs.hatch-test.matrix = [
  # Test the lowest and highest supported Python versions with normal deps
  { deps = [ "stable" ], python = [ "3.12", "3.13", "3.14" ], feature-set = [ "full" ] },
  # Test the newest supported Python version with different feature sets
  { deps = [ "stable" ], python = [ "3.14" ], feature-set = [ "min", "sphinx" ] },
  # Test the newest supported Python version also with pre-release deps
  { deps = [ "pre" ], python = [ "3.14" ], feature-set = [ "full" ] },
]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { value = "allow", key = "UV_PRERELEASE", if = [ "pre" ] },
]
# Modules needing optional deps can’t be imported for doctest collection without all features.
envs.hatch-test.overrides.matrix.feature-set.env-vars = [
  { value = "--doctest-ignore-import-errors", key = "PYTEST_ADDOPTS", if = [ "min", "sphinx" ] },
]
envs.hatch-test.overrides.matrix.feature-set.extra-dependencies = [
  { value = "sphinx-autodoc-typehints", if = [ "sphinx", "full" ] },
]
envs.hatch-test.overrides.matrix.feature-set.features = [
  # make sure the sphinx extension works without having all deps
  { value = "sphinx", if = [ "sphinx", "full" ] },
  { value = "datasets", if = [ "full" ] },
  { value = "spatialdata", if = [ "full" ] },
  { value = "settings", if = [ "full" ] },
  { value = "logging", if = [ "full" ] },          # pydantic tier of the logging config
  { value = "rich", if = [ "full" ] },             # exercise the rich handler tier
]
envs.hatch-test.default-args = []
envs.hatch-test.dependency-groups = [ "dev", "test" ]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
format.docstring-code-format = true
lint.select = [
  "ANN",    # flake8-annotations
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "EM",     # Error messages
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TC",     # flake8-type-checking
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008",   # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "C408",   # `dict()` is sometimes nicer than `{}`
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D105",   # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107",   # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203",   # We don’t want a blank line before a class docstring
  "D213",   # <> We want docstrings to start immediately after the opening triple quote
  "D400",   # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401",   # First line should be in imperative mood; try rephrasing
  "E501",   # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731",   # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741",   # allow I, O, l as variable names -> I is the identity matrix
  "TID252", # allow relative imports
]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.flake8-type-checking.runtime-evaluated-base-classes = [
  # ruff can’t follow inheritance across modules, so list each base explicitly
  "pydantic.BaseModel",
  "pydantic_settings.BaseSettings",
  "scverse_misc.Settings",
]
lint.pydocstyle.convention = "google"

[tool.mypy]
mypy_path = [ "$MYPY_CONFIG_FILE_DIR/stubs", "$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/tests/_pkgs" ]
explicit_package_bases = true
enable_error_code = [ "deprecated" ]
strict = true

[tool.pytest]
addopts = [
  "--import-mode=importlib", # allow using test files with same name
  "--doctest-modules",
]
filterwarnings = [
  "error",
]
strict = true
testpaths = [ "src", "tests" ]

[tool.coverage]
run.source = [ "scverse_misc" ]
run.omit = [
  "**/test_*.py",
]
run.patch = [ "subprocess" ]

[tool.cruft]
skip = [
  ".git",
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
